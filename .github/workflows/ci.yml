name: CI

# Na main, o CI roda dentro do workflow "Deploy" (que só publica se o CI passar).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      azurite:  # emulador do Azure Table Storage (testes de contrato)
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10002:10002"]
        options: >-
          --entrypoint azurite-table
    env:
      # Chave pública e documentada do Azurite (não é segredo)
      AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest
      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
