name: CI

# Na main, o CI roda dentro do workflow "Deploy" (que só publica se o CI passar).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      # Chave pública e documentada do Azurite (não é segredo)
      AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Azurite (emulador do Azure Table Storage, para os testes de contrato)
        # Rodado à mão (e não como "service") para poder escutar em 0.0.0.0: por padrão o
        # Azurite escuta só dentro do contêiner e o teste recebe "Connection reset".
        run: |
          docker run -d --name azurite -p 10002:10002 mcr.microsoft.com/azure-storage/azurite \
            azurite-table --tableHost 0.0.0.0 --skipApiVersionCheck --loose
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10002/; then echo "Azurite pronto"; exit 0; fi
            sleep 1
          done
          docker logs azurite
          exit 1
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest
      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
